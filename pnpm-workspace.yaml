# Configuración de pnpm. Desde pnpm 11 los settings NO se leen del campo
# "pnpm" de package.json — viven aquí (https://pnpm.io/settings).
#
# pnpm bloquea los scripts de instalación por defecto (defensa supply-chain):
# cada dependencia que quiera ejecutar código al instalarse se aprueba a mano.
# Estas dos compilan binarios nativos y sin su script el build falla.
allowBuilds:
  '@tailwindcss/oxide': true   # motor nativo de Tailwind v4
  esbuild: true                # binario que vite usa para transformar

# Un peer sin satisfacer ROMPE la instalación en vez de quedarse en advertencia.
# Con la advertencia por defecto, react-day-picker v8 convivió con React 19 sin
# declararlo hasta que npm lo señaló como error en CI; esto lo hace visible en
# el momento de instalar, no meses después.
strictPeerDependencies: true

# Endurecimiento supply-chain (investigación 2026-08-17; contexto: Shai-Hulud,
# ChainDrop). pnpm 10 bloqueó install scripts; pnpm 11 endureció el resto —
# estos hacen la política explícita y suben el cooldown al triple del default.
minimumReleaseAge: 4320   # 3 días: una versión recién publicada no se instala
blockExoticSubdeps: true  # default v11, explícito: sin deps git/tarball ocultas
strictDepBuilds: true     # default v11, explícito
savePrefix: ''            # pins exactos en package.json de aquí en adelante
