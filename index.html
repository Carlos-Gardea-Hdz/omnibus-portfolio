    <script>
      (function () {
        try {
          var stored = localStorage.getItem("omnibus-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          // localStorage unavailable — keep the default light theme
        }
      })();
    </script>
