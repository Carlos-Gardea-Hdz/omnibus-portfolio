name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El GITHUB_TOKEN no necesita mas que lectura en ningun job.
permissions:
  contents: read

# Serializa los deploys por ref: dos merges rapidos no pueden publicar fuera
# de orden (el run viejo pisaria al nuevo con rsync --delete, en verde).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Lee la versión de pnpm del campo "packageManager" de package.json,
      # así CI y local no pueden divergir.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Va ANTES del build a propósito: 'vite build' usa esbuild, que transpila
      # sin comprobar tipos — un error de tipos pasaría el build en verde.
      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Quality gate: audits the built site with Lighthouse CI and fails the check
  # when any score drops below the thresholds in lighthouserc.json. Runs on
  # every PR and on pushes to main. It only depends on 'build', so it runs in
  # parallel with the deploy jobs and never blocks them: it gates the PR merge,
  # not the release pipeline.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout is only needed for lighthouserc.json; the audited site comes
      # from the build artifact, same as the deploy jobs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dist
          path: dist

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  # Deploy continuo: cada push a main (= cada merge de PR) publica el MISMO
  # artefacto que pasó type-check y build — primero staging, luego producción.
  # La llave SSH (secret VPS_SSH_KEY) está enjaulada en el VPS con un forced
  # command de rrsync: solo puede escribir bajo /opt/omnibus/portfolio, nada
  # más. nginx sirve estáticos por bind mount, así que no hace falta reload.
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://carlosgardea.cloud
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dist
          path: dist

      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: mkdir -p ~/.ssh && echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Rsync to staging
        run: rsync -az --delete ./dist/ deployer_vps@195.35.37.195:dist/

      # El deploy no se da por bueno con "rsync exit 0": staging debe SERVIR
      # el artefacto nuevo antes de que production arranque.
      - name: Smoke test staging
        run: |
          marker=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          curl -fsS --max-time 15 https://carlosgardea.cloud/ | grep -qF "$marker"
          curl -fsS -o /dev/null --max-time 15 "https://carlosgardea.cloud/$marker"

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # El environment 'production' permite añadir aprobación manual en
    # Settings → Environments cuando se quiera un gate humano.
    environment:
      name: production
      url: https://carlosgardea.com
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dist
          path: dist

      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: mkdir -p ~/.ssh && echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Rsync to production
        run: rsync -az --delete ./dist/ deployer_vps@195.35.37.195:dist-prod/

      - name: Smoke test production
        run: |
          marker=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          curl -fsS --max-time 15 https://carlosgardea.com/ | grep -qF "$marker"
          curl -fsS -o /dev/null --max-time 15 "https://carlosgardea.com/$marker"
